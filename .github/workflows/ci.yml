name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Core build + test (cross-platform) ───────────────────────────
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: src/Hermes.Web
        run: npm ci

      - name: Check canonical React source and build provenance
        working-directory: src/Hermes.Web
        shell: bash
        run: |
          npm run lint
          npm run test:unit
          npm run build
          npm run test:reproducible
          npm run test:discovery

      - name: Restore (core + service + tests only)
        run: |
          dotnet restore src/Hermes.Core/Hermes.Core.fsproj
          dotnet restore src/Hermes.Service/Hermes.Service.fsproj
          dotnet restore tests/Hermes.Tests/Hermes.Tests.fsproj
          dotnet restore tests/Hermes.Servicing.Tests/Hermes.Servicing.Tests.csproj
          dotnet restore tests/Hermes.Setup.Tests/Hermes.Setup.Tests.csproj
          dotnet restore tests/Hermes.Installer.Control.Tests/Hermes.Installer.Control.Tests.csproj
          dotnet tool restore

      - name: Build
        run: |
          dotnet build src/Hermes.Core/Hermes.Core.fsproj --no-restore -c Release -v q
          dotnet build src/Hermes.Service/Hermes.Service.fsproj --no-restore -c Release -v q
          dotnet build tests/Hermes.Tests/Hermes.Tests.fsproj --no-restore -c Release -v q
          dotnet build tests/Hermes.Servicing.Tests/Hermes.Servicing.Tests.csproj --no-restore -c Release -v q
          dotnet build tests/Hermes.Setup.Tests/Hermes.Setup.Tests.csproj --no-restore -c Release -v q
          dotnet build tests/Hermes.Installer.Control.Tests/Hermes.Installer.Control.Tests.csproj --no-restore -c Release -v q

      - name: Test portable Setup and installer authority
        shell: pwsh
        run: |
          dotnet test tests/Hermes.Setup.Tests/Hermes.Setup.Tests.csproj --no-build --no-restore -c Release -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Hermes.Installer.Control.Tests/Hermes.Installer.Control.Tests.csproj --no-build --no-restore -c Release -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test and merge native coverage
        shell: pwsh
        env:
          COVERLET_DATACOLLECTOR_INPROC_EXCEPTIONLOG_ENABLED: '1'
        run: |
          ./scripts/Test-CoverageGate.ps1
          $collectorRoot = (& dotnet msbuild tests/Hermes.Tests/Hermes.Tests.fsproj -nologo -getProperty:Pkgcoverlet_collector).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $servicingCollectorRoot = (& dotnet msbuild tests/Hermes.Servicing.Tests/Hermes.Servicing.Tests.csproj -nologo -getProperty:Pkgcoverlet_collector).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($collectorRoot -cne $servicingCollectorRoot) { throw 'Both coverage suites must use the same pinned collector.' }
          $collectorPath = Join-Path $collectorRoot 'build/netstandard2.0/coverlet.collector.dll'
          $collectorAssembly = [Reflection.AssemblyName]::GetAssemblyName($collectorPath)
          [xml]$settings = '<RunSettings><InProcDataCollectionRunSettings><InProcDataCollectors><InProcDataCollector /></InProcDataCollectors></InProcDataCollectionRunSettings></RunSettings>'
          $collector = $settings.SelectSingleNode('/RunSettings/InProcDataCollectionRunSettings/InProcDataCollectors/InProcDataCollector')
          $collector.SetAttribute('assemblyQualifiedName', "Coverlet.Collector.DataCollection.CoverletInProcDataCollector, $($collectorAssembly.FullName)")
          $collector.SetAttribute('friendlyName', 'XPlat Code Coverage')
          $collector.SetAttribute('enabled', 'True')
          $collector.SetAttribute('codebase', $collectorPath)
          New-Item -ItemType Directory -Force -Path .artifacts/coverage | Out-Null
          $settings.Save((Join-Path $PWD '.artifacts/coverage/flush.runsettings'))
          foreach ($suite in @('servicing', 'core')) {
            $report = ".artifacts/coverage/$suite/tests.trx"
            if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report }
          }
          # Only the in-process flush hook is enabled; native Coverlet remains the sole instrumenter.
          dotnet coverlet tests/Hermes.Servicing.Tests/bin/Release/net9.0/Hermes.Servicing.Tests.dll --target dotnet --targetargs "vstest tests/Hermes.Servicing.Tests/bin/Release/net9.0/Hermes.Servicing.Tests.dll --Settings:.artifacts/coverage/flush.runsettings --Logger:trx;LogFileName=tests.trx --ResultsDirectory:.artifacts/coverage/servicing" --format json --format cobertura --output .artifacts/coverage/servicing/coverage --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $filter = if ($IsWindows) { " --TestCaseFilter:Platform!=Unix" } else { "" }
          dotnet coverlet tests/Hermes.Tests/bin/Release/net9.0/Hermes.Tests.dll --target dotnet --targetargs "vstest tests/Hermes.Tests/bin/Release/net9.0/Hermes.Tests.dll --Settings:.artifacts/coverage/flush.runsettings --Logger:trx;LogFileName=tests.trx --ResultsDirectory:.artifacts/coverage/core$filter" --merge-with .artifacts/coverage/servicing/coverage.json --format json --format cobertura --output .artifacts/coverage/combined/coverage --verbosity quiet
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $reports = @(Get-ChildItem -LiteralPath .artifacts/coverage/core -Filter tests.trx -File)
            if ($reports.Count -eq 0) { Write-Warning 'Core test execution failed without a TRX report.' }
            foreach ($report in $reports) {
              [xml]$results = Get-Content -LiteralPath $report.FullName -Raw
              foreach ($failure in @($results.TestRun.Results.UnitTestResult | Where-Object outcome -EQ 'Failed')) {
                Write-Output ("Failed test: " + ($failure.testName -replace '\(.*$', ''))
                $message = [string]$failure.Output.ErrorInfo.Message
                $message = $message -replace 'h1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '<redacted-access-token>'
                $message = $message -replace '(?<![A-Za-z0-9_-])[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])', '<redacted-proof>'
                $message = $message -replace '\b[0-9A-HJKMNP-TV-Z]{4}(?:-[0-9A-HJKMNP-TV-Z]{4}){2}\b', '<redacted-pairing-code>'
                $message = $message -replace '(?i)Bearer\s+[^\s"'',;}\]]+', 'Bearer <redacted>'
                $message = $message -replace '\s+', ' '
                Write-Output ("Failure message: " + $message.Substring(0, [Math]::Min(4096, $message.Length)))
                # Captured output stays private; only bounded call frames accompany the redacted message.
                $failure.Output.ErrorInfo.StackTrace -split '\r?\n' |
                  Where-Object { $_ -match '^\s*at\s' } | Select-Object -First 32 | Write-Output
              }
            }
            exit $testExitCode
          }
          foreach ($suite in @('servicing', 'core')) {
            ./scripts/Assert-TestExecution.ps1 -ReportPath ".artifacts/coverage/$suite/tests.trx" -Suite $suite
          }

      - name: Install browser
        working-directory: src/Hermes.Web
        run: npx playwright install chromium

      - name: Browser smoke against isolated real Service
        working-directory: src/Hermes.Web
        run: npm test

      - name: Enforce exact 85% line and 60% branch coverage
        shell: pwsh
        run: ./scripts/Assert-Coverage.ps1 -ReportPath .artifacts/coverage/combined/coverage.cobertura.xml

      - name: Upload coverage
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .artifacts/coverage/combined/coverage.cobertura.xml
            .artifacts/coverage/servicing/coverage.cobertura.xml
          retention-days: 3

  # ── Windows Tray app ─────────────────────────────────────────────
  build-tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json

      - name: Build canonical React
        working-directory: src/Hermes.Web
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Build Tray app
        run: dotnet build src/Hermes.Tray/Hermes.Tray.csproj -c Release -v q

      - name: Test owned native lifecycle
        run: dotnet test tests/Hermes.Tray.Tests/Hermes.Tray.Tests.csproj -c Release -v q

      - name: Build external installed-Tray smoke harness
        run: dotnet build tests/Hermes.Tray.Smoke/Hermes.Tray.Smoke.csproj -c Release -v q

      # Real WebView/ownership proof now runs inside the installed Tray in the
      # blocking installer job below. The service-only host CLI is not supported.

  # Compatibility builds remain excluded from the supported product surface.
  build-shell-windows:
    name: Excluded MAUI compatibility build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build Shell
        run: dotnet build src/Hermes.Shell/Hermes.Shell.csproj -c Release -v q

  # ── MAUI Shell (macOS) ───────────────────────────────────────────
  build-shell-macos:
    name: Excluded MAUI compatibility build (macOS)
    runs-on: macos-latest
    continue-on-error: true  # Xcode version may not match MAUI workload requirement
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst

      - name: Build Shell
        run: dotnet build src/Hermes.Shell/Hermes.Shell.csproj -c Release -v q

  installer:
    name: Supported Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json
      - name: Reject synthetic payload contamination and build changed runtime payloads
        shell: pwsh
        run: |
          npm ci --prefix src/Hermes.Web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix src/Hermes.Web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./installer/windows/Publish-Servicing.ps1 -OutputDirectory "$PWD/.artifacts/servicing"
          ./installer/windows/Publish-Acceptance.ps1 -ServicingBuildPath "$PWD/.artifacts/servicing/servicing-build.json" -OutputDirectory "$PWD/.artifacts/servicing-acceptance"
          ./installer/windows/Publish-Payload.ps1 -PayloadDirectory "$PWD/.artifacts/installer-payload" -InventoryDirectory "$PWD/.artifacts/installer-inventory" -RuntimeVersion 0.1.0
          ./installer/windows/Publish-Payload.ps1 -PayloadDirectory "$PWD/.artifacts/installer-upgrade-payload" -InventoryDirectory "$PWD/.artifacts/installer-upgrade-inventory" -RuntimeVersion 0.1.1
          node --test installer/windows/payload.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./installer/windows/Test-PackageLayout.ps1
          dotnet publish tests/Hermes.Tray.Smoke/Hermes.Tray.Smoke.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$PWD/.artifacts/installer-smoke-host" -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the complete Windows servicing test project
        shell: pwsh
        run: |
          $servicing = Get-Content -LiteralPath "$PWD/.artifacts/servicing/servicing-build.json" -Raw | ConvertFrom-Json
          $trust = $servicing.approvedGuardSha256.Replace(';', '%3B')
          dotnet test tests/Hermes.Servicing.WindowsTests/Hermes.Servicing.WindowsTests.csproj -c Release "-p:HermesApprovedGuardSha256=$trust"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Temporary one-bit observation, deliberately blocking all lifecycle work.
      # Empty/nonempty Signature evidence is not media acceptance or a failure origin.
      - name: Observe published MSI Signature emptiness read-only and stop before lifecycle
        shell: pwsh
        run: |
          ./installer/windows/Test-MsiTableObservation.ps1
          $servicing = Get-Content -LiteralPath "$PWD/.artifacts/servicing/servicing-build.json" -Raw | ConvertFrom-Json
          $published = "$PWD/.artifacts/table-observation-candidate"
          ./installer/windows/Build-Package.ps1 -PayloadDirectory "$PWD/.artifacts/installer-payload" -InventoryDirectory "$PWD/.artifacts/installer-inventory" -PackageVersion 0.1.0 -OutputDirectory $published -GuardPath $servicing.guardPath -ExpectedGuardSha256 $servicing.guardSha256 -ServicingBuildPath "$PWD/.artifacts/servicing/servicing-build.json"
          Import-Module ./installer/windows/Msi-TableObservation.psm1 -Force
          $observation = Invoke-HermesPublishedTableObservation -PublishedDirectory $published -RepositoryRoot "$PWD"
          $json = $observation | ConvertTo-Json -Depth 8
          if ([Text.Encoding]::UTF8.GetByteCount($json) -gt 128KB) { throw 'Table observation exceeded its evidence bound.' }
          New-Item -ItemType Directory -Force -Path "$PWD/.artifacts/installer-evidence" | Out-Null
          $json | Set-Content -LiteralPath "$PWD/.artifacts/installer-evidence/msi-table-observation.json" -Encoding utf8
          Write-Output $json
          throw 'Observation only: lifecycle and distribution remain blocked; no media acceptance or failure origin established.'
      - name: Coordinator install, repair, launch, upgrade, rollback and uninstall without SDK access
        shell: pwsh
        run: |
          $servicing = Get-Content -LiteralPath "$PWD/.artifacts/servicing/servicing-build.json" -Raw | ConvertFrom-Json
          $helpers = Get-Content -LiteralPath "$PWD/.artifacts/servicing-acceptance/acceptance-build.json" -Raw | ConvertFrom-Json
          ./installer/windows/Test-Installer.ps1 -PayloadDirectory "$PWD/.artifacts/installer-payload" -InventoryDirectory "$PWD/.artifacts/installer-inventory" -UpgradePayloadDirectory "$PWD/.artifacts/installer-upgrade-payload" -UpgradeInventoryDirectory "$PWD/.artifacts/installer-upgrade-inventory" -SmokeExecutable "$PWD/.artifacts/installer-smoke-host/Hermes.Tray.Smoke.exe" -SetupExecutable $servicing.setupExecutable -GuardPath $servicing.guardPath -GuardSha256 $servicing.guardSha256 -ServicingBuildPath "$PWD/.artifacts/servicing/servicing-build.json" -AcceptanceExecutable $helpers.acceptanceExecutable -ProbeOldDirectory $helpers.probeOld -ProbeNewDirectory $helpers.probeNew -EvidenceDirectory "$PWD/.artifacts/installer-evidence"
      - name: Require complete actual native recovery and fence evidence
        shell: pwsh
        run: |
          ./installer/windows/Assert-ServicingEvidence.ps1 -EvidenceDirectory "$PWD/.artifacts/installer-evidence"
      - name: Preserve bounded synthetic acceptance and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-acceptance
          path: |
            .artifacts/installer-evidence/acceptance.json
            .artifacts/installer-evidence/*-native.json
            .artifacts/installer-evidence/actual-servicing.json
            .artifacts/installer-evidence/msi-table-observation.json
          if-no-files-found: warn
          retention-days: 3

  # ── Publish only after supported installer acceptance ────────────
  publish:
    needs: [build-and-test, build-tray, installer]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: hermes-windows
          - os: macos-latest
            rid: osx-arm64
            artifact: hermes-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: src/Hermes.Web
        run: npm ci

      - name: Build canonical React
        working-directory: src/Hermes.Web
        shell: bash
        run: |
          npm run build
          npm run test:discovery

      - name: Publish Service and Windows Tray with SDK-resolved inventory
        shell: pwsh
        run: |
          if ("${{ matrix.rid }}" -eq "win-x64") {
            ./installer/windows/Publish-Payload.ps1 -PayloadDirectory "$PWD/publish" -InventoryDirectory "$PWD/.artifacts/release-inventory"
          } else {
            dotnet publish src/Hermes.Service/Hermes.Service.fsproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/service
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify published React provenance
        run: node src/Hermes.Web/scripts/assets.mjs verify publish/service/wwwroot

      - name: Install browser
        working-directory: src/Hermes.Web
        run: npx playwright install chromium

      - name: Smoke the exact published Service and React bundle
        working-directory: src/Hermes.Web
        shell: pwsh
        run: |
          $env:HERMES_TEST_SERVICE_DLL = (Resolve-Path "../../publish/service/Hermes.Service.dll").Path
          npm test

      - name: Build supported Windows MSI
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./installer/windows/Publish-Servicing.ps1 -OutputDirectory "$PWD/.artifacts/release-servicing"
          $servicing = Get-Content -LiteralPath "$PWD/.artifacts/release-servicing/servicing-build.json" -Raw | ConvertFrom-Json
          ./installer/windows/Build-Package.ps1 -PayloadDirectory "$PWD/publish" -InventoryDirectory "$PWD/.artifacts/release-inventory" -PackageVersion 0.1.0 -OutputDirectory "$PWD/.artifacts/installer-release" -GuardPath $servicing.guardPath -ExpectedGuardSha256 $servicing.guardSha256 -ServicingBuildPath "$PWD/.artifacts/release-servicing/servicing-build.json"
          ./installer/windows/New-WindowsBundle.ps1 -ServicingBuildPath "$PWD/.artifacts/release-servicing/servicing-build.json" -PackageDirectory "$PWD/.artifacts/installer-release" -OutputPath "$PWD/.artifacts/Hermes-Windows-Preview.zip"

      - name: Upload complete Windows coordinator and MSI bundle
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-installer
          path: .artifacts/Hermes-Windows-Preview.zip
          retention-days: 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/
          retention-days: 3
