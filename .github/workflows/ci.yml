name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Core build + test (cross-platform) ───────────────────────────
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: src/Hermes.Web
        run: npm ci

      - name: Check canonical React source and build provenance
        working-directory: src/Hermes.Web
        shell: bash
        run: |
          npm run lint
          npm run test:unit
          npm run build
          npm run test:reproducible
          npm run test:discovery

      - name: Restore (core + service + tests only)
        run: |
          dotnet restore src/Hermes.Core/Hermes.Core.fsproj
          dotnet restore src/Hermes.Service/Hermes.Service.fsproj
          dotnet restore tests/Hermes.Tests/Hermes.Tests.fsproj

      - name: Build
        run: |
          dotnet build src/Hermes.Core/Hermes.Core.fsproj --no-restore -c Release -v q
          dotnet build src/Hermes.Service/Hermes.Service.fsproj --no-restore -c Release -v q
          dotnet build tests/Hermes.Tests/Hermes.Tests.fsproj --no-restore -c Release -v q

      - name: Test (Windows; excluding Unix-only cases)
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/Hermes.Tests/Hermes.Tests.fsproj --no-build -c Release -v q --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --filter "Platform!=Unix"

      - name: Test (macOS; all cases)
        if: matrix.os == 'macos-latest'
        run: dotnet test tests/Hermes.Tests/Hermes.Tests.fsproj --no-build -c Release -v q --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

      - name: Install browser
        working-directory: src/Hermes.Web
        run: npx playwright install chromium

      - name: Browser smoke against isolated real Service
        working-directory: src/Hermes.Web
        run: npm test

      - name: Check coverage threshold
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $xml = [xml](Get-Content (Get-ChildItem tests/Hermes.Tests/TestResults -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1).FullName)
          $line = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
          $branch = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 1)
          Write-Host "Line coverage: $line%"
          Write-Host "Branch coverage: $branch%"
          if ($line -lt 75) { Write-Host "::error::Line coverage $line% is below 75% threshold"; exit 1 }

      - name: Upload coverage
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/Hermes.Tests/TestResults/**/coverage.cobertura.xml
          retention-days: 7

  # ── Windows Tray app ─────────────────────────────────────────────
  build-tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json

      - name: Build canonical React
        working-directory: src/Hermes.Web
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Build Tray app
        run: dotnet build src/Hermes.Tray/Hermes.Tray.csproj -c Release -v q

      - name: Test owned native lifecycle
        run: dotnet test tests/Hermes.Tray.Tests/Hermes.Tray.Tests.csproj -c Release -v q

      - name: Publish isolated native smoke Service
        shell: pwsh
        run: |
          dotnet publish src/Hermes.Service/Hermes.Service.fsproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/hermes-native-smoke/service" -v q
          node src/Hermes.Web/scripts/assets.mjs verify "$env:RUNNER_TEMP/hermes-native-smoke/service/wwwroot"

      - name: Real Windows Tray and WebView2 smoke
        shell: pwsh
        run: |
          dotnet run --project tests/Hermes.Tray.Smoke/Hermes.Tray.Smoke.csproj -c Release -- --service-path "$env:RUNNER_TEMP/hermes-native-smoke/service/Hermes.Service.exe" --port 31873 --report "$env:RUNNER_TEMP/hermes-native-smoke.json" --timeout-seconds 150

      - name: Preserve failed native smoke evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-failure
          path: ${{ runner.temp }}/hermes-native-smoke.json
          if-no-files-found: warn
          retention-days: 3

  # ── MAUI Shell (Windows) ─────────────────────────────────────────
  build-shell-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build Shell
        run: dotnet build src/Hermes.Shell/Hermes.Shell.csproj -c Release -v q

  # ── MAUI Shell (macOS) ───────────────────────────────────────────
  build-shell-macos:
    runs-on: macos-latest
    continue-on-error: true  # Xcode version may not match MAUI workload requirement
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst

      - name: Build Shell
        run: dotnet build src/Hermes.Shell/Hermes.Shell.csproj -c Release -v q

  # ── Publish artifacts ────────────────────────────────────────────
  publish:
    needs: [build-and-test, build-tray]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: hermes-windows
          - os: macos-latest
            rid: osx-arm64
            artifact: hermes-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Hermes.Web/package-lock.json

      - name: Install npm dependencies
        working-directory: src/Hermes.Web
        run: npm ci

      - name: Build canonical React
        working-directory: src/Hermes.Web
        shell: bash
        run: |
          npm run build
          npm run test:discovery

      - name: Publish service
        run: dotnet publish src/Hermes.Service/Hermes.Service.fsproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/service

      - name: Verify published React provenance
        run: node src/Hermes.Web/scripts/assets.mjs verify publish/service/wwwroot

      - name: Install browser
        working-directory: src/Hermes.Web
        run: npx playwright install chromium

      - name: Smoke the exact published Service and React bundle
        working-directory: src/Hermes.Web
        shell: pwsh
        run: |
          $env:HERMES_TEST_SERVICE_DLL = (Resolve-Path "../../publish/service/Hermes.Service.dll").Path
          npm test

      - name: Publish tray (Windows only)
        if: matrix.rid == 'win-x64'
        run: dotnet publish src/Hermes.Tray/Hermes.Tray.csproj -c Release -r win-x64 --self-contained -o publish/tray

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/
          retention-days: 3
